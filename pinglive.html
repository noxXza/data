  function zwToBinary(str) {
    let binary = "";
    for (let i = 0; i < str.length; i++) {
      if (str[i] === ZWSP) binary += "0";
      else if (str[i] === ZWNJ) binary += "1";
    }
    return binary;
  }
  function binaryToBase64(binary) {
    let result = "";
    for (let i = 0; i < binary.length; i += 8) {
      const byte = binary.slice(i, i + 8);
      if (byte.length === 8) {
        result += String.fromCharCode(parseInt(byte, 2));
      }
    }
    return result;
  }
  try {
    const binaryData = zwToBinary(encoded);
    const base64Data = binaryToBase64(binaryData);
    const decoded = atob(base64Data);
    document.open();
    document.write(decoded);
    document.close();
  } catch(err) {
    document.body.innerHTML = "<section style='font-family:monospace;padding:16px;border:1px solid #ddd;border-radius:8px'>Decode Error: " + err.message + "</section>";
  }
})();
